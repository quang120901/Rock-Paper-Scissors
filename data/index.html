<!DOCTYPE html>
<html>

<head>
	<title>Rock Paper Scissors GAME</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="data:,">
	<link rel="stylesheet" type="text/css" href="style.css">
	<script src="jquery.min.js"></script>
</head>

<body>

	<h1 class="headline">Rock Paper Scissors GAME</h1>
	<div class="content">

		<div class="game-card">
			<div class="choice-selector">
				<label for="sspbAuswahl">Choose your move</label>
				<select id="sspbAuswahl">
					<option id="scissors" value="scissors">Scissors</option>
					<option id="rock" value="rock">Rock</option>
					<option id="paper" value="paper">Paper</option>
				</select>
			</div>

			<button name="submitentry" id="play-btn" class="play-button" onClick="submitGET()">Play!</button>
		</div>

		<div id="result-banner" class="result-banner"></div>

		<button id="play-again-btn" class="play-again-button" onClick="resetGame()" style="display:none;">
			Play Again
		</button>

	</div>

	<div class="stats-section">
		<h2 class="stats-header">Results</h2>

		<table class="stats-table">
			<thead>
				<tr>
					<th>Round</th>
					<th>Won</th>
					<th>Lost</th>
					<th>Tied</th>
				</tr>
			</thead>
			<tbody id="scores">
			</tbody>
		</table>
	</div>

</body>

</html>

<script>

	// Delay (ms) between each word of the countdown, and after "Shoot!"
	// before the actual /play request is sent.
	var COUNTDOWN_STEP_MS = 450;
	var COUNTDOWN_STEPS = ["Rock...", "Paper...", "Scissors...", "Shoot!"];

	function submitGET() {
		var userInput = $("#sspbAuswahl").val().toLowerCase();

		$("#play-btn").prop("disabled", true);

		runCountdown(function () {
			playRound(userInput);
		});
	}

	function runCountdown(onDone) {
		var i = 0;
		$("#result-banner").addClass("visible");

		function nextStep() {
			if (i < COUNTDOWN_STEPS.length) {
				$("#result-banner").text(COUNTDOWN_STEPS[i]);
				i++;
				setTimeout(nextStep, COUNTDOWN_STEP_MS);
			} else {
				setTimeout(function () {
					$("#result-banner").text("").removeClass("visible");
					onDone();
				}, 200);
			}
		}

		nextStep();
	}

	function playRound(userInput) {
		$.getJSON("/play?sspb=" + userInput, function (data) {
			addRow(data);

			if (data.gameOver) {
				showGameOver(data);
			} else {
				$("#play-btn").prop("disabled", false);
			}
		}).fail(function () {
			console.log("Request to /play failed");
			$("#play-btn").prop("disabled", false);
		});
	}

	function addRow(data) {
		var row = $("<tr>")
			.addClass("row-" + data.result)
			.addClass("row-new");

		row.append($("<td>").addClass("round-number").text(data.round));
		row.append($("<td>").addClass("won").text(data.won));
		row.append($("<td>").addClass("lost").text(data.lost));
		row.append($("<td>").addClass("tied").text(data.tied));

		$("#scores").prepend(row);

		// trigger fade-in animation
		setTimeout(function () {
			row.removeClass("row-new");
		}, 20);
	}

	function showGameOver(data) {
		var message;
		if (data.won > data.lost) {
			message = "You won the match!";
		} else if (data.lost > data.won) {
			message = "The bot won the match!";
		} else {
			message = "The match ended in a tie!";
		}

		$("#result-banner").text(message).addClass("visible");
		$("#play-btn").prop("disabled", true);
		$("#play-again-btn").show();
	}

	function resetGame() {
		$.get("/reset", function () {
			$("#scores").empty();
			$("#result-banner").text("").removeClass("visible");
			$("#play-btn").prop("disabled", false);
			$("#play-again-btn").hide();
		});
	}

</script>
