<!DOCTYPE html>
<html>

<head>
	<title>Rock Paper Scissors GAME</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="data:,">
	<link rel="stylesheet" type="text/css" href="style.css">
	<script src="jquery.min.js"></script>
</head>

<body>

	<h1 class="headline">Rock Paper Scissors GAME</h1>
	<div class="content">

		<div class="game-card">
			<div class="choice-selector">
				<label for="sspbAuswahl">Choose your move</label>
				<select id="sspbAuswahl">
					<option id="scissors" value="scissors">Scissors</option>
					<option id="rock" value="rock">Rock</option>
					<option id="paper" value="paper">Paper</option>
				</select>
			</div>

			<button name="submitentry" class="play-button" onClick="submitGET()">Play!</button>
		</div>

	</div>

	<div class="stats-section">
		<h2 class="stats-header">Results</h2>

		<table class="stats-table">
			<thead>
				<tr>
					<th>Round</th>
					<th>Won</th>
					<th>Lost</th>
					<th>Tied</th>
				</tr>
			</thead>
			<tbody id="scores">
				<tr>
					<td class="round-number"></td>
					<td class="won"></td>
					<td class="lost"></td>
					<td class="tied"></td>
				</tr>
			</tbody>
		</table>
	</div>

</body>

</html>

<script>

	var trCounter = 0;

	function submitGET() {
		//we will pass data to our ESP32
		var userInput = $("#sspbAuswahl").val().toLowerCase();
		console.log(userInput);

		$.get("?sspb=" + userInput, function (data) {
			//here is nothing to do for us
		});
	}


	if (!!window.EventSource) {

		var source = new EventSource('/events');

		source.addEventListener('open', function (e) {
			console.log("Events Connected");
		}, false);
		source.addEventListener('error', function (e) {
			if (e.target.readyState != EventSource.OPEN) {
				console.log("Events Disconnected");
			}
		}, false);

		source.addEventListener('message', function (e) {
			console.log("message", e.data);
		}, false);

		source.addEventListener('won', function (e) {
			console.log("won", e.data);

			var row = "<tr id='" + trCounter + "'><td class='round-number smallNumbers'>" + trCounter + "</td>";
			$("#scores").append(row);

			row = "<td class='won smallNumbers'>" + e.data + "</td>";
			$("#" + trCounter).append(row);

		}, false);

		source.addEventListener('lost', function (e) {

			var row = "<td class='lost smallNumbers'>" + e.data + "</td>";
			$("#" + trCounter).append(row);

		}, false);

		source.addEventListener('tied', function (e) {
			row = "<td class='tied smallNumbers'>" + e.data + "</td>";
			$("#" + trCounter).append(row);

			//close the line
			$("#" + trCounter).append("</tr>");


			trCounter++;


		}, false);





	}


</script>
